<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>经典扫雷 (Minesweeper)</title>
  <style>
    :root {
      --bg-color: #f1f3f5;
      --card-bg: #ffffff;
      --board-bg: #c0c0c0;
      --board-border: #7b7b7b;
      --cell-unrevealed-bg: #c0c0c0;
      --cell-border-light: #ffffff;
      --cell-border-dark: #7b7b7b;
      --cell-revealed-bg: #d9d9d9;
      --cell-revealed-border: #bebebe;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --lcd-bg: #000000;
      --lcd-color: #ef4444;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 12px;
    }

    header {
      text-align: center;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .diff-selector {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .diff-btn {
      appearance: none;
      border: 1px solid #d1d5db;
      background: #ffffff;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.15s ease;
    }

    .diff-btn:hover {
      background: #f3f4f6;
      border-color: #9ca3af;
    }

    .diff-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .game-wrapper {
      background: #c0c0c0;
      border: 3px solid;
      border-color: var(--cell-border-light) var(--cell-border-dark) var(--cell-border-dark) var(--cell-border-light);
      padding: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
      max-width: 100vw;
      overflow-x: auto;
    }

    .status-bar {
      background: #c0c0c0;
      border: 2px solid;
      border-color: var(--cell-border-dark) var(--cell-border-light) var(--cell-border-light) var(--cell-border-dark);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .lcd-display {
      background: var(--lcd-bg);
      color: var(--lcd-color);
      font-family: "Courier New", Courier, monospace;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 2px 6px;
      border-radius: 3px;
      min-width: 58px;
      text-align: right;
      line-height: 1;
    }

    .face-btn {
      width: 38px;
      height: 38px;
      border: 2px solid;
      border-color: var(--cell-border-light) var(--cell-border-dark) var(--cell-border-dark) var(--cell-border-light);
      background: #c0c0c0;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 4px;
      line-height: 1;
    }

    .face-btn:active {
      border-color: var(--cell-border-dark) var(--cell-border-light) var(--cell-border-light) var(--cell-border-dark);
    }

    .board-container {
      border: 2px solid;
      border-color: var(--cell-border-dark) var(--cell-border-light) var(--cell-border-light) var(--cell-border-dark);
      display: inline-block;
      overflow: hidden;
      touch-action: manipulation;
    }

    .board {
      display: grid;
      gap: 0px;
      background: #7b7b7b;
    }

    .cell {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-sizing: border-box;
      line-height: 1;
      border: 2px solid;
      border-color: var(--cell-border-light) var(--cell-border-dark) var(--cell-border-dark) var(--cell-border-light);
      background-color: #c0c0c0;
    }

    .cell:active:not(.revealed):not(.flagged) {
      border: 1px solid #7b7b7b;
      background-color: var(--cell-revealed-bg);
    }

    .cell.revealed {
      border: 1px solid #999;
      background-color: var(--cell-revealed-bg);
      cursor: default;
    }

    .cell.hit {
      background-color: #ef4444 !important;
    }

    .cell.wrong-flag {
      background-color: #fca5a5;
    }

    /* 数字色彩标准 */
    .cell[data-count="1"] { color: #0000ff; }
    .cell[data-count="2"] { color: #008000; }
    .cell[data-count="3"] { color: #ff0000; }
    .cell[data-count="4"] { color: #000080; }
    .cell[data-count="5"] { color: #800000; }
    .cell[data-count="6"] { color: #008080; }
    .cell[data-count="7"] { color: #000000; }
    .cell[data-count="8"] { color: #808080; }

    .help-hint {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    .help-hint kbd {
      background: #e5e7eb;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: inherit;
      border: 1px solid #d1d5db;
    }

    @media (max-width: 600px) {
      .cell {
        width: 32px;
        height: 32px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>经典扫雷</h1>
    <div class="diff-selector">
      <button class="diff-btn active" data-diff="easy">初级 (9×9, 10雷)</button>
      <button class="diff-btn" data-diff="medium">中级 (16×16, 40雷)</button>
      <button class="diff-btn" data-diff="hard">高级 (16×30, 99雷)</button>
    </div>
  </header>

  <main class="game-wrapper">
    <div class="status-bar">
      <div class="lcd-display" id="mineCounter">010</div>
      <button class="face-btn" id="faceBtn" title="点击重新开始">🙂</button>
      <div class="lcd-display" id="timer">000</div>
    </div>

    <div class="board-container">
      <div class="board" id="board"></div>
    </div>
  </main>

  <footer class="help-hint">
    <p>鼠标：左键揭开 / 右键插旗 / 双击数字快速开邻域</p>
    <p>触屏：点击揭开 / 长按约 300ms 插旗</p>
    <p>快捷键：<kbd>R</kbd> 重置本局，<kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> 切换难度</p>
  </footer>

  <script>
    class MinesweeperGame {
      constructor(rows = 9, cols = 9, mineCount = 10) {
        this.rows = rows;
        this.cols = cols;
        this.mineCount = Math.min(mineCount, rows * cols - 1);
        this.reset();
      }

      reset() {
        this.status = 'ready'; // 'ready' | 'playing' | 'won' | 'lost'
        this.flagsLeft = this.mineCount;
        this.revealedCount = 0;
        this.hitMine = null;
        this.customBoard = false;
        this.board = [];

        for (let r = 0; r < this.rows; r++) {
          const row = [];
          for (let c = 0; c < this.cols; c++) {
            row.push({
              row: r,
              col: c,
              isMine: false,
              revealed: false,
              flagged: false,
              neighborMines: 0
            });
          }
          this.board.push(row);
        }
      }

      getCell(r, c) {
        if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) {
          return null;
        }
        return this.board[r][c];
      }

      getNeighbors(r, c) {
        const neighbors = [];
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const cell = this.getCell(r + dr, c + dc);
            if (cell) neighbors.push(cell);
          }
        }
        return neighbors;
      }

      setupCustomBoard(rows, cols, mineCoords) {
        this.rows = rows;
        this.cols = cols;
        this.mineCount = mineCoords.length;
        this.reset();
        this.customBoard = true;
        for (const { r, c } of mineCoords) {
          const cell = this.getCell(r, c);
          if (cell) cell.isMine = true;
        }
        this._calculateNeighborMines();
      }

      placeMines(safeR, safeC) {
        const totalCells = this.rows * this.cols;
        const canIsolate3x3 = (totalCells - 9) >= this.mineCount;

        const forbidden = new Set();
        if (canIsolate3x3) {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = safeR + dr;
              const nc = safeC + dc;
              if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
                forbidden.add(`${nr},${nc}`);
              }
            }
          }
        } else {
          forbidden.add(`${safeR},${safeC}`);
        }

        const available = [];
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            if (!forbidden.has(`${r},${c}`)) {
              available.push({ r, c });
            }
          }
        }

        for (let i = available.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [available[i], available[j]] = [available[j], available[i]];
        }

        for (let i = 0; i < this.mineCount && i < available.length; i++) {
          const { r, c } = available[i];
          this.board[r][c].isMine = true;
        }

        this._calculateNeighborMines();
      }

      _calculateNeighborMines() {
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const cell = this.board[r][c];
            if (cell.isMine) {
              cell.neighborMines = 0;
              continue;
            }
            const neighbors = this.getNeighbors(r, c);
            cell.neighborMines = neighbors.filter(n => n.isMine).length;
          }
        }
      }

      reveal(r, c) {
        if (this.status !== 'ready' && this.status !== 'playing') {
          return;
        }

        const cell = this.getCell(r, c);
        if (!cell || cell.revealed || cell.flagged) {
          return;
        }

        if (this.status === 'ready') {
          if (!this.customBoard) {
            this.placeMines(r, c);
          }
          this.status = 'playing';
        }

        if (cell.isMine) {
          cell.revealed = true;
          this.status = 'lost';
          this.hitMine = { row: r, col: c };
          this._revealAllMines();
          return;
        }

        this._floodFill(cell);
        this._checkWinCondition();
      }

      _floodFill(startCell) {
        const queue = [startCell];
        startCell.revealed = true;
        this.revealedCount++;

        while (queue.length > 0) {
          const current = queue.shift();
          if (current.neighborMines === 0) {
            const neighbors = this.getNeighbors(current.row, current.col);
            for (const neighbor of neighbors) {
              if (!neighbor.revealed && !neighbor.flagged && !neighbor.isMine) {
                neighbor.revealed = true;
                this.revealedCount++;
                if (neighbor.neighborMines === 0) {
                  queue.push(neighbor);
                }
              }
            }
          }
        }
      }

      _revealAllMines() {
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const cell = this.board[r][c];
            if (cell.isMine) {
              cell.revealed = true;
            }
          }
        }
      }

      toggleFlag(r, c) {
        if (this.status !== 'ready' && this.status !== 'playing') {
          return false;
        }

        const cell = this.getCell(r, c);
        if (!cell || cell.revealed) {
          return false;
        }

        cell.flagged = !cell.flagged;
        this.flagsLeft += cell.flagged ? -1 : 1;
        return true;
      }

      chord(r, c) {
        if (this.status !== 'playing') return;

        const cell = this.getCell(r, c);
        if (!cell || !cell.revealed || cell.neighborMines <= 0) return;

        const neighbors = this.getNeighbors(r, c);
        const flagCount = neighbors.filter(n => n.flagged).length;

        if (flagCount === cell.neighborMines) {
          for (const neighbor of neighbors) {
            if (!neighbor.revealed && !neighbor.flagged) {
              this.reveal(neighbor.row, neighbor.col);
            }
          }
        }
      }

      _checkWinCondition() {
        const nonMineCells = this.rows * this.cols - this.mineCount;
        if (this.revealedCount >= nonMineCells) {
          this.status = 'won';
          for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
              const cell = this.board[r][c];
              if (cell.isMine && !cell.flagged) {
                cell.flagged = true;
              }
            }
          }
          this.flagsLeft = 0;
        }
      }
    }

    (function () {
      const PRESETS = {
        easy: { rows: 9, cols: 9, mines: 10 },
        medium: { rows: 16, cols: 16, mines: 40 },
        hard: { rows: 16, cols: 30, mines: 99 }
      };

      let currentDiff = 'easy';
      let game = null;
      let timerInterval = null;
      let elapsedSeconds = 0;

      const boardEl = document.getElementById('board');
      const mineCounterEl = document.getElementById('mineCounter');
      const timerEl = document.getElementById('timer');
      const faceBtnEl = document.getElementById('faceBtn');
      const diffButtons = document.querySelectorAll('.diff-btn');

      function pad3(num) {
        if (num < 0) {
          const clamped = Math.max(-99, num);
          return '-' + Math.abs(clamped).toString().padStart(2, '0');
        }
        return Math.min(999, Math.max(0, num)).toString().padStart(3, '0');
      }

      function startTimer() {
        if (timerInterval) return;
        elapsedSeconds = 0;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
          elapsedSeconds++;
          updateTimerDisplay();
          if (elapsedSeconds >= 999) {
            clearInterval(timerInterval);
          }
        }, 1000);
      }

      function stopTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function updateTimerDisplay() {
        timerEl.textContent = pad3(elapsedSeconds);
      }

      function updateMineDisplay() {
        mineCounterEl.textContent = pad3(game.flagsLeft);
      }

      function updateFace() {
        if (game.status === 'won') {
          faceBtnEl.textContent = '😎';
        } else if (game.status === 'lost') {
          faceBtnEl.textContent = '😵';
        } else {
          faceBtnEl.textContent = '🙂';
        }
      }

      function initGame(diffKey) {
        stopTimer();
        elapsedSeconds = 0;
        updateTimerDisplay();

        const config = PRESETS[diffKey];
        game = new MinesweeperGame(config.rows, config.cols, config.mines);
        renderInitialBoard();
        updateMineDisplay();
        updateFace();
      }

      function renderInitialBoard() {
        boardEl.style.gridTemplateColumns = `repeat(${game.cols}, auto)`;
        boardEl.innerHTML = '';

        for (let r = 0; r < game.rows; r++) {
          for (let c = 0; c < game.cols; c++) {
            const cellEl = document.createElement('div');
            cellEl.className = 'cell';
            cellEl.dataset.row = r;
            cellEl.dataset.col = c;
            boardEl.appendChild(cellEl);
          }
        }
      }

      function syncBoardUI() {
        for (let r = 0; r < game.rows; r++) {
          for (let c = 0; c < game.cols; c++) {
            const cell = game.getCell(r, c);
            const index = r * game.cols + c;
            const el = boardEl.children[index];
            if (!el) continue;

            el.className = 'cell';
            el.textContent = '';
            delete el.dataset.count;

            if (cell.revealed) {
              el.classList.add('revealed');
              if (cell.isMine) {
                if (game.hitMine && game.hitMine.row === r && game.hitMine.col === c) {
                  el.classList.add('hit');
                  el.textContent = '💥';
                } else {
                  el.textContent = '💣';
                }
              } else if (cell.neighborMines > 0) {
                el.dataset.count = cell.neighborMines;
                el.textContent = cell.neighborMines;
              }
            } else if (cell.flagged) {
              if (game.status === 'lost' && !cell.isMine) {
                el.classList.add('wrong-flag');
                el.textContent = '❌';
              } else {
                el.classList.add('flagged');
                el.textContent = '🚩';
              }
            }
          }
        }

        updateMineDisplay();
        updateFace();
      }

      function handleReveal(r, c) {
        if (game.status === 'won' || game.status === 'lost') return;

        const isFirstMove = game.status === 'ready';
        game.reveal(r, c);

        if (isFirstMove && game.status === 'playing') {
          startTimer();
        }

        if (game.status === 'won' || game.status === 'lost') {
          stopTimer();
        }

        syncBoardUI();
      }

      function handleFlag(r, c) {
        if (game.status !== 'ready' && game.status !== 'playing') return;
        game.toggleFlag(r, c);
        syncBoardUI();
      }

      function handleChord(r, c) {
        if (game.status !== 'playing') return;
        game.chord(r, c);
        if (game.status === 'won' || game.status === 'lost') {
          stopTimer();
        }
        syncBoardUI();
      }

      // 事件绑定：鼠标交互
      boardEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });

      boardEl.addEventListener('mousedown', (e) => {
        const cellEl = e.target.closest('.cell');
        if (!cellEl) return;
        const r = parseInt(cellEl.dataset.row, 10);
        const c = parseInt(cellEl.dataset.col, 10);

        if (e.button === 2) {
          // 右键插旗
          handleFlag(r, c);
        } else if (e.button === 0) {
          if (game.status === 'ready' || game.status === 'playing') {
            faceBtnEl.textContent = '😮';
          }
        }
      });

      boardEl.addEventListener('mouseup', (e) => {
        if (e.button === 0) {
          updateFace();
          const cellEl = e.target.closest('.cell');
          if (!cellEl) return;
          const r = parseInt(cellEl.dataset.row, 10);
          const c = parseInt(cellEl.dataset.col, 10);
          handleReveal(r, c);
        }
      });

      boardEl.addEventListener('dblclick', (e) => {
        const cellEl = e.target.closest('.cell');
        if (!cellEl) return;
        const r = parseInt(cellEl.dataset.row, 10);
        const c = parseInt(cellEl.dataset.col, 10);
        handleChord(r, c);
      });

      // 触屏交互支持（短触揭开，长按 320ms 插旗）
      let touchTimer = null;
      let isLongPress = false;

      boardEl.addEventListener('touchstart', (e) => {
        const cellEl = e.target.closest('.cell');
        if (!cellEl) return;
        const r = parseInt(cellEl.dataset.row, 10);
        const c = parseInt(cellEl.dataset.col, 10);
        isLongPress = false;

        touchTimer = setTimeout(() => {
          isLongPress = true;
          handleFlag(r, c);
          if (navigator.vibrate) {
            navigator.vibrate(40);
          }
        }, 320);
      }, { passive: true });

      boardEl.addEventListener('touchend', (e) => {
        if (touchTimer) {
          clearTimeout(touchTimer);
          touchTimer = null;
        }
        if (!isLongPress) {
          const cellEl = e.target.closest('.cell');
          if (!cellEl) return;
          const r = parseInt(cellEl.dataset.row, 10);
          const c = parseInt(cellEl.dataset.col, 10);
          const cell = game.getCell(r, c);
          if (cell && cell.revealed) {
            handleChord(r, c);
          } else {
            handleReveal(r, c);
          }
        }
      });

      boardEl.addEventListener('touchmove', () => {
        if (touchTimer) {
          clearTimeout(touchTimer);
          touchTimer = null;
        }
      }, { passive: true });

      faceBtnEl.addEventListener('click', () => {
        initGame(currentDiff);
      });

      diffButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          diffButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentDiff = btn.dataset.diff;
          initGame(currentDiff);
        });
      });

      // 键盘快捷键
      window.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') {
          initGame(currentDiff);
        } else if (e.key === '1') {
          document.querySelector('[data-diff="easy"]').click();
        } else if (e.key === '2') {
          document.querySelector('[data-diff="medium"]').click();
        } else if (e.key === '3') {
          document.querySelector('[data-diff="hard"]').click();
        }
      });

      // 启动游戏
      initGame('easy');
    })();
  </script>
</body>
</html>
